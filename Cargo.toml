[workspace]
resolver = "2"
members = ["crates/carnet-core", "crates/carnet-sync", "crates/carnet-vault", "crates/carnet-wasm", "crates/presse-rs", "crates/presse-web"]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.85"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
