<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Carnet</title>
    <meta name="description" content="Carnet : un bullet journal à l'encre, sur Presse. Semaine en double page, migration et suggestions au crayon." />
    <meta name="theme-color" content="#f5f3ee" />
    <link rel="manifest" href="./carnet/manifest.webmanifest" />
    <link rel="icon" href="./carnet/icon-192.png" />
    <script type="module" src="/src/carnet/main.ts"></script>
  </head>
  <body class="cn">
    <header class="cn-bar">
      <div class="cn-brand"><b>Carnet</b><span>v0 · sur Presse</span></div>
      <nav class="cn-tools" aria-label="Navigation">
        <div class="cn-seg" role="group" aria-label="Vue">
          <button type="button" data-view="week" aria-pressed="true">Semaine</button>
          <button type="button" data-view="day" aria-pressed="false">Jour</button>
          <button type="button" data-view="month" aria-pressed="false">Mois</button>
          <button type="button" data-view="year" aria-pressed="false">Année</button>
          <button type="button" data-view="collections" aria-pressed="false">Collections</button>
        </div>
        <button class="cn-btn" id="cn-search" type="button" aria-haspopup="dialog" aria-keyshortcuts="/">Rechercher</button>
        <button class="cn-btn" id="cn-stickers" type="button" aria-expanded="false" aria-controls="cn-tray">Autocollants</button>
        <button class="cn-btn" id="cn-draw" type="button" aria-pressed="false">Dessiner</button>
        <button class="cn-btn" id="cn-photo" type="button">Photos</button>
        <input id="cn-photo-file" type="file" accept="image/*" multiple hidden />
        <button class="cn-btn cn-icon" id="prev" type="button" aria-label="Semaine précédente">‹</button>
        <button class="cn-btn" id="today" type="button">Aujourd'hui</button>
        <button class="cn-btn cn-icon" id="next" type="button" aria-label="Semaine suivante">›</button>
      </nav>
    </header>

    <div class="cn-sample cn-readonly" id="cn-readonly" role="alert" data-gl-ignore hidden>
      <span></span>
      <button class="cn-btn" id="cn-reload" type="button">Recharger</button>
    </div>
    <div class="cn-sample" id="cn-sample" hidden>
      <span>Carnet d'exemple : les entrées et l'agenda sont fictifs.</span>
      <button class="cn-btn" id="cn-reset" type="button">Vider le carnet</button>
    </div>

    <h1 class="cn-title" id="cn-title" data-gl-text data-gl-morph>Semaine</h1>

    <main class="cn-spread" id="spread" data-view="week">
      <section class="cn-page cn-left" aria-label="Page de gauche"></section>
      <section class="cn-page cn-right" aria-label="Page de droite"></section>
    </main>

    <footer class="cn-foot">
      <span id="cn-gpu" data-gl-ignore>GPU : démarrage…</span>
      <span id="cn-save" class="cn-save" data-gl-ignore></span>
      <span>Saisie : <kbd>.</kbd> tâche <kbd>o</kbd> événement <kbd>-</kbd> note <kbd>*</kbd> priorité <kbd>14:00</kbd> heure · <kbd>[</kbd> <kbd>]</kbd> page</span>
      <button class="cn-link" id="cn-reseed" type="button">Recharger l'exemple</button>
      <button class="cn-link" id="cn-backup" type="button">Exporter</button>
      <button class="cn-link" id="cn-versions" type="button" aria-haspopup="dialog">Versions</button>
      <button class="cn-link" id="cn-restore" type="button">Importer une sauvegarde</button>
      <input id="cn-restore-file" type="file" accept=".carnet,application/zip" hidden />
      <button class="cn-link" id="cn-ics" type="button">Importer un agenda (.ics)</button>
      <button class="cn-link" id="cn-meteo" type="button" aria-haspopup="dialog">Météo</button>
      <button class="cn-link" id="cn-light" type="button" aria-pressed="true">Lumière de l'heure</button>
      <input id="cn-ics-file" type="file" accept=".ics,text/calendar" hidden />
      <a class="cn-link" href="./carnet-banc.html">Banc de mesure Android</a>
      <a class="cn-link" href="./carnet-recette.html">Recette téléphone</a>
    </footer>
    <aside class="cn-tray" id="cn-tray" data-gl-ignore hidden></aside>
    <div class="cn-drawbar" id="cn-drawbar" role="toolbar" aria-label="Dessin" data-gl-ignore hidden></div>
    <div class="cn-toast" id="cn-toast" role="status" aria-live="polite" data-gl-ignore hidden></div>
  </body>
</html>
