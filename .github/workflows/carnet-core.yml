name: carnet-core

on:
  push:
    paths: ["crates/**", "Cargo.toml", "Cargo.lock", ".github/workflows/carnet-core.yml"]
  pull_request:
    paths: ["crates/**", "Cargo.toml", "Cargo.lock", ".github/workflows/carnet-core.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy -p carnet-core --all-targets -- -D warnings
      - name: Tests (convergence : 2 000 scénarios)
        run: cargo test -p carnet-core --release
        env:
          PROPTEST_CASES: "2000"
      - name: Compilation WebAssembly
        run: cargo build -p carnet-core --target wasm32-unknown-unknown --release
