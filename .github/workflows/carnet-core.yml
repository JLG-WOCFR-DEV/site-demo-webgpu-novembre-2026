name: carnet-core

on:
  push:
    paths: ["crates/**", "Cargo.toml", "Cargo.lock", "src/carnet/**", "src/presse/rs-host.ts", "src/gpu/text.ts", "tools/carnet-wasm.sh", ".github/workflows/carnet-core.yml"]
  pull_request:
    paths: ["crates/**", "Cargo.toml", "Cargo.lock", "src/carnet/**", "src/presse/rs-host.ts", "src/gpu/text.ts", "tools/carnet-wasm.sh", ".github/workflows/carnet-core.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: |
          cargo clippy -p carnet-core -p carnet-wasm -p presse-rs --all-targets -- -D warnings
          cargo clippy -p presse-web --target wasm32-unknown-unknown -- -D warnings
      - name: Tests (convergence : 2 000 scénarios)
        run: cargo test -p carnet-core -p presse-rs --release
        env:
          PROPTEST_CASES: "2000"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: Module wasm (le même script qu'en local)
        run: ./tools/carnet-wasm.sh
      - name: Tests de la coquille (core wasm + IndexedDB simulé)
        run: npm test
