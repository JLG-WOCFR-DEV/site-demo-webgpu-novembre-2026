[package]
name = "carnet-sync"
version = "0.1.0"
edition = "2021"
description = "Carnet — synchro chiffrée de bout en bout (docs/carnet/sync.md)"
license = "MIT"

[dependencies]
carnet-core = { path = "../carnet-core" }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
hkdf = "0.12"
yrs = "0.28"
hmac = "0.12"
sha2 = { version = "0.10", default-features = false }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
proptest = "1.12"
