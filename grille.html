<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>WebGPU-demo-UBS · Grille infinie</title>
    <meta name="description" content="Un mur de photos sans fin, qu'on tire dans tous les sens ; chaque photo ouvre sa page, et l'image vole d'une vue à l'autre." />
    <meta name="theme-color" content="#efeee8" />
    <script type="module" src="/src/grille/main.ts"></script>
  </head>
  <body class="gr">
    <!-- Un composant : déroulé en HTML statique à la construction (presse/build).
         La liste des photos qu'il produit est ce que lisent le clavier et les
         lecteurs d'écran ; chaque photo a sa vraie URL (?photo=…). -->
    <x-grille full kicker="WebGPU-demo-UBS · Grille infinie" label="Mur de photos">
      <img src="./plates/pont.jpg" data-id="pont" data-title="Le pont" alt="Le Golden Gate depuis la côte, l'écume au pied d'une falaise verte."
        data-body="Le Golden Gate depuis la côte, à marée montante. Le rouge du pont, le vert de la falaise, l'écume : trois couleurs, une seule lumière de fin de matinée." />
      <img src="./plates/jardin.jpg" data-id="jardin" data-title="Le jardin" alt="Un jardin japonais : azalées rouges, lanterne de pierre et maison de thé."
        data-body="Un jardin japonais au printemps. Les azalées rouges tiennent le premier plan, la maison de thé se cache sous les pins." />
      <img src="./plates/alcatraz.jpg" data-id="alcatraz" data-title="L'île" alt="L'île d'Alcatraz et son phare au milieu de la baie."
        data-body="Alcatraz au milieu de la baie : le phare, les bâtiments clairs, et tout autour une eau d'un seul bleu." />
      <img src="./plates/yosemite.jpg" data-id="yosemite" data-title="La vallée" alt="La vallée de Yosemite : parois de granit, une cascade, la brume."
        data-body="La vallée de Yosemite vue d'en haut : des parois de granit, une cascade minuscule, et la brume qui efface les plans du fond." />
      <img src="./plates/lac.jpg" data-id="lac" data-title="Le lac" alt="Un lac entre des collines dorées, sous un ciel strié."
        data-body="Un lac de barrage entre des collines dorées. Le ciel est strié de traînées d'avion, l'eau les reprend à peine." />
      <img src="./plates/dunes.jpg" data-id="dunes" data-title="Les dunes" alt="Des dunes claires et un bois mort tordu, dans la Vallée de la Mort."
        data-body="Les dunes de la Vallée de la Mort : un sable presque blanc, des buissons ronds, et un bois mort tordu comme une lettre." />
      <img src="./plates/cerf.jpg" data-id="cerf" data-title="Le cerf" alt="Un jeune cerf dans un jardin en pente, en lumière rasante."
        data-body="Un jeune cerf dans un jardin en pente. Il s'est arrêté dans la seule tache d'ombre, le temps de la photo." />
    </x-grille>
  </body>
</html>
